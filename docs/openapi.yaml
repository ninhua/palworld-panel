          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /boss/schedules/{id}/run-now:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    post:
      operationId: runBossScheduleNow
      description: Creates a record-only summon immediately from the schedule. It does not spawn a Boss in Palworld.
      tags:
      - boss
      x-palpanel-permission: server:control
      responses:
        '201':
          $ref: '#/components/responses/SuccessResponse'
