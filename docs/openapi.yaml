        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: archiveBossSchedule
      tags:
      - boss
      x-palpanel-permission: config:write
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
