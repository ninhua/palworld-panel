      tags:
      - boss
      x-palpanel-permission: server:control
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: palpanel_session
      description: HttpOnly SameSite=Lax session cookie created by registration or login.
    developmentKey:
      type: http
      scheme: bearer
      bearerFormat: ppk_...
      description: 'Revocable development key supplied as Authorization: Bearer ppk_...'
  schemas:
    DiagnosticStatus:
      type: object
      required: [http_enabled, shell_enabled, timeout_ms, max_output, platform]
      properties:
        http_enabled: {type: boolean}
        shell_enabled: {type: boolean}
        timeout_ms: {type: integer, minimum: 1}
        max_output: {type: integer, minimum: 1}
        platform: {type: string}
    DiagnosticStatusEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/DiagnosticStatus'}
    DiagnosticHTTPRequest:
      type: object
      required: [method, url]
      additionalProperties: false
      properties:
        method: {type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE]}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        body: {type: string, maxLength: 65536}
    DiagnosticHTTPResult:
      type: object
      required: [method, url, status, status_code, headers, body, truncated, duration_ms]
      properties:
        method: {type: string}
        url: {type: string, format: uri}
        status: {type: string}
        status_code: {type: integer}
        headers:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        body: {type: string}
        truncated: {type: boolean}
        duration_ms: {type: integer, minimum: 0}
    DiagnosticHTTPResultEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/DiagnosticHTTPResult'}
    DiagnosticShellRequest:
      type: object
      required: [command, confirm]
      additionalProperties: false
      properties:
        command: {type: string, minLength: 1, maxLength: 4096}
        confirm: {type: boolean, const: true}
    DiagnosticShellResult:
      type: object
      required: [command, output, exit_code, success, timed_out, truncated, duration_ms, error]
      properties:
        command: {type: string}
        output: {type: string}
        exit_code: {type: integer}
        success: {type: boolean}
        timed_out: {type: boolean}
        truncated: {type: boolean}
        duration_ms: {type: integer, minimum: 0}
        error: {type: string}
    DiagnosticShellResultEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/DiagnosticShellResult'}
    SupportBundleCheck:
      type: object
      required: [id, ok, required, message]
      properties:
        id: {type: string}
        ok: {type: boolean}
        required: {type: boolean}
        message: {type: string}
    SupportBundleStatus:
      type: object
      required: [schema_version, directory_ready, max_bundles, max_bundle_bytes, max_log_files, max_log_bytes_per_file, retention_days, checks]
      properties:
        schema_version: {type: integer, const: 1}
        directory_ready: {type: boolean}
        max_bundles: {type: integer, minimum: 1}
        max_bundle_bytes: {type: integer, minimum: 1}
        max_log_files: {type: integer, minimum: 0}
        max_log_bytes_per_file: {type: integer, minimum: 0}
        retention_days: {type: integer, minimum: 1}
        checks: {type: array, items: {$ref: '#/components/schemas/SupportBundleCheck'}}
    SupportBundleStatusEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/SupportBundleStatus'}
    SupportBundleCreateRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        include_logs: {type: boolean, default: false}
        confirm: {type: boolean, const: true}
    SupportBundleMetadata:
      type: object
      required: [id, file_name, created_at, size_bytes, sha256, include_logs, entries]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        file_name: {type: string}
        created_at: {type: string, format: date-time}
        size_bytes: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        include_logs: {type: boolean}
        entries: {type: array, items: {type: string}}
    SupportBundleEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/SupportBundleMetadata'}
    SupportBundleListEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {type: array, items: {$ref: '#/components/schemas/SupportBundleMetadata'}}
    SaveIndexCounts:
      type: object
      required: [players, guilds, bases, pals, containers, map_entities]
      properties:
        players: {type: integer, minimum: 0}
        guilds: {type: integer, minimum: 0}
        bases: {type: integer, minimum: 0}
        pals: {type: integer, minimum: 0}
        containers: {type: integer, minimum: 0}
        map_entities: {type: integer, minimum: 0}
    SaveIndexStatus:
      type: object
      required: [enabled, state, stale, source_path, updated_at, duration_ms, warnings, counts]
      properties:
        enabled: {type: boolean}
        state: {type: string, enum: [disabled, missing, not_indexed, ready, stale, error]}
        stale: {type: boolean}
        source_path: {type: string}
        updated_at: {type: string}
        duration_ms: {type: integer, minimum: 0}
        error: {type: string}
        error_code: {type: string}
        error_detail: {type: string, maxLength: 513}
        oodle_available: {type: boolean}
        warnings: {type: array, items: {type: string}}
        counts: {$ref: '#/components/schemas/SaveIndexCounts'}
        parser: {type: string}
        cache_path: {type: string}
    SaveHistorySource:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [server, import]}
    SaveHistorySnapshot:
      type: object
      additionalProperties: false
      required: [id, fingerprint, generated_at, captured_at, parser, counts, size_bytes]
      properties:
        id: {type: string, pattern: '^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{32}$'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{32}$'}
        generated_at: {type: string, format: date-time}
        captured_at: {type: string, format: date-time}
        parser: {type: string}
        counts: {$ref: '#/components/schemas/SaveIndexCounts'}
        size_bytes: {type: integer, format: int64, minimum: 0}
    SaveHistoryState:
      type: object
      additionalProperties: false
      required: [source, retention, minimum_interval_seconds, max_total_bytes, total_bytes, items]
      properties:
        source: {$ref: '#/components/schemas/SaveHistorySource'}
        retention: {type: integer, minimum: 1}
        minimum_interval_seconds: {type: integer, minimum: 0}
        max_total_bytes: {type: integer, format: int64, minimum: 1}
        total_bytes: {type: integer, format: int64, minimum: 0}
        items: {type: array, items: {$ref: '#/components/schemas/SaveHistorySnapshot'}}
    SaveHistoryStateEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/SaveHistoryState'}
    SaveHistoryFieldChange:
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field: {type: string}
        before: {type: string}
        after: {type: string}
    SaveHistoryChange:
      type: object
      additionalProperties: false
      required: [category, kind, id, label, fields]
      properties:
        category: {type: string, enum: [players, guilds, bases, pals, containers, items]}
        kind: {type: string, enum: [added, removed, changed, increased, decreased]}
        id: {type: string}
        label: {type: string}
        delta: {type: integer}
        fields: {type: array, items: {$ref: '#/components/schemas/SaveHistoryFieldChange'}}
    SaveHistoryEvent:
      type: object
      additionalProperties: false
      required: [id, category, kind, actor_type, actor_id, actor_label, subject_type, subject_id, subject_label, target_type, target_id, target_label, before, after, details, metadata, inferred]
      properties:
        id: {type: string}
        category: {type: string, enum: [players, guilds, bases, pals, containers, items]}
        kind: {type: string}
        actor_type: {type: string}
        actor_id: {type: string}
        actor_label: {type: string}
        subject_type: {type: string}
        subject_id: {type: string}
        subject_label: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        target_label: {type: string}
        delta: {type: integer}
        before: {type: string}
        after: {type: string}
        details: {type: array, items: {$ref: '#/components/schemas/SaveHistoryFieldChange'}}
        metadata: {type: object, additionalProperties: {type: string}}
        inferred: {type: boolean, const: true}
    SaveHistoryDiffSummary:
      type: object
      additionalProperties: false
      required: [players_added, players_removed, players_changed, guilds_added, guilds_removed, guilds_changed, bases_added, bases_removed, bases_changed, pals_added, pals_removed, pals_changed, containers_added, containers_removed, containers_changed, items_increased, items_decreased]
      properties:
        players_added: {type: integer, minimum: 0}
        players_removed: {type: integer, minimum: 0}
        players_changed: {type: integer, minimum: 0}
        guilds_added: {type: integer, minimum: 0}
        guilds_removed: {type: integer, minimum: 0}
        guilds_changed: {type: integer, minimum: 0}
        bases_added: {type: integer, minimum: 0}
        bases_removed: {type: integer, minimum: 0}
        bases_changed: {type: integer, minimum: 0}
        pals_added: {type: integer, minimum: 0}
        pals_removed: {type: integer, minimum: 0}
        pals_changed: {type: integer, minimum: 0}
        containers_added: {type: integer, minimum: 0}
        containers_removed: {type: integer, minimum: 0}
        containers_changed: {type: integer, minimum: 0}
        items_increased: {type: integer, minimum: 0}
        items_decreased: {type: integer, minimum: 0}
    SaveHistoryDiff:
      type: object
      additionalProperties: false
      required: [from, to, summary, total, limit, offset, items, event_total, events]
      properties:
        from: {$ref: '#/components/schemas/SaveHistorySnapshot'}
        to: {$ref: '#/components/schemas/SaveHistorySnapshot'}
        summary: {$ref: '#/components/schemas/SaveHistoryDiffSummary'}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 500}
        offset: {type: integer, minimum: 0}
        items: {type: array, items: {$ref: '#/components/schemas/SaveHistoryChange'}}
        event_total: {type: integer, minimum: 0}
        events: {type: array, items: {$ref: '#/components/schemas/SaveHistoryEvent'}}
    SaveHistoryDiffEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: true}
        data: {$ref: '#/components/schemas/SaveHistoryDiff'}
    Player:
      type: object
      required: [id, player_uid, steam_id, nickname, level, guild_id, guild_name, is_online, online_source, online_stale, last_online_time, location_x, location_y, location_z]
      properties:
        id: {type: string}
        player_uid: {type: string}
        steam_id: {type: string}
        nickname: {type: string}
        level: {type: integer, minimum: 0}
        guild_id: {type: string}
        guild_name: {type: string}
        is_online: {type: boolean}
        online_source: {type: string, enum: [none, rest, paldefender, rest+paldefender]}
        online_stale: {type: boolean}
        gm_user_id: {type: string}
        last_online_time: {type: string}
        location_x: {type: number}
        location_y: {type: number}
        location_z: {type: number}
        inventory_summary: {type: object, additionalProperties: true}
        note: {type: string, maxLength: 500}
        tags: {type: array, maxItems: 8, items: {type: string, maxLength: 24}}
        has_annotation: {type: boolean}
        annotation_updated_at: {type: string}
        presence_available: {type: boolean}
        presence_stale: {type: boolean}
        presence_observed_at: {type: string, format: date-time}
        presence_online: {type: boolean}
        session_seconds: {type: integer, format: int64, minimum: 0}
        total_seconds: {type: integer, format: int64, minimum: 0}
        session_started_at: {type: string, format: date-time}
