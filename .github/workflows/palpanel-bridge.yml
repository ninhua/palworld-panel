name: PalPanelBridge build

on:
  workflow_dispatch:
  push:
    branches: [custom-stable]
    paths:
      - "tools/palpanel-bridge/src/**"
      - "tools/palpanel-bridge/CMakeLists.txt"
      - "tools/palpanel-bridge/build-local.ps1"
      - "tools/palpanel-bridge/config.ini.example"
      - ".github/workflows/palpanel-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.UEPSEUDO_TOKEN }}
      UE4SS_COMMIT: c838a8acaade1a0f860bdf249f039e58f4e10088
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Check private SDK credential
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Repository secret UEPSEUDO_TOKEN is required to read Re-UE4SS/UEPseudo"
          }

      - name: Fetch matching experimental UE4SS SDK
        shell: pwsh
        run: |
          gh auth setup-git
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\RE-UE4SS" | Out-Null
          git -C "$env:RUNNER_TEMP\RE-UE4SS" init
          git -C "$env:RUNNER_TEMP\RE-UE4SS" remote add origin https://github.com/UE4SS-RE/RE-UE4SS.git
          git -C "$env:RUNNER_TEMP\RE-UE4SS" fetch --depth 1 origin $env:UE4SS_COMMIT
          git -C "$env:RUNNER_TEMP\RE-UE4SS" checkout --detach FETCH_HEAD
          git -C "$env:RUNNER_TEMP\RE-UE4SS" submodule update --init --recursive --depth 1

      - name: Build bridge DLL
        shell: pwsh
        run: |
          $rustupProxy = Join-Path $env:CARGO_HOME "bin\rustc.exe"
          if (-not (Test-Path -LiteralPath $rustupProxy -PathType Leaf)) {
            throw "Rust compiler proxy not found after toolchain setup: $rustupProxy"
          }
          $rustSysroot = (& $rustupProxy --print sysroot).Trim()
          $rustc = Join-Path $rustSysroot "bin\rustc.exe"
          if (-not (Test-Path -LiteralPath $rustc -PathType Leaf)) {
            throw "Rust toolchain compiler not found: $rustc"
          }
          ./tools/palpanel-bridge/build-local.ps1 `
            -UE4SSRoot "$env:RUNNER_TEMP\RE-UE4SS" `
            -OutputDir "$env:RUNNER_TEMP\palpanel-bridge-build" `
            -RustCompiler $rustc

      - name: Create server-ready mod package
        shell: pwsh
        run: |
          $artifact = "$env:RUNNER_TEMP\palpanel-bridge-build\artifact\PalPanelBridge"
          $packageRoot = "$env:RUNNER_TEMP\palpanel-bridge-package"
          $package = Join-Path $packageRoot "PalPanelBridge"
          $zip = "$env:RUNNER_TEMP\PalPanelBridge-v0.1.21-ue4ss-c838a8ac.zip"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath $artifact -Destination $package -Recurse
          Copy-Item -LiteralPath "$package\config.ini.example" -Destination "$package\config.ini"
          New-Item -ItemType File -Force -Path "$package\enabled.txt" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\RE-UE4SS\LICENSE" "$package\UE4SS-LICENSE.txt"
          Get-FileHash "$package\dlls\main.dll" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant()) *dlls/main.dll" } |
            Set-Content -Encoding ascii "$package\SHA256SUMS"
          Compress-Archive -LiteralPath $package -DestinationPath $zip -CompressionLevel Optimal

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = $archive.Entries.FullName
            $required = @(
              "PalPanelBridge/dlls/main.dll",
              "PalPanelBridge/config.ini",
              "PalPanelBridge/enabled.txt",
              "PalPanelBridge/SHA256SUMS"
            )
            foreach ($entry in $required) {
              if ($entry -notin $entries) {
                throw "Server package is missing required entry: $entry"
              }
            }
          } finally {
            $archive.Dispose()
          }

      - uses: actions/upload-artifact@v6
        with:
          name: PalPanelBridge-v0.1.21-ue4ss-c838a8ac-server-package
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/PalPanelBridge-v0.1.21-ue4ss-c838a8ac.zip
