name: PalPanelBridge probe

on:
  workflow_dispatch:
  push:
    branches: [custom-stable]
    paths:
      - "tools/palpanel-bridge/**"
      - ".github/workflows/palpanel-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned UE4SS SDK
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --branch v3.0.1 --depth 1 https://github.com/UE4SS-RE/RE-UE4SS.git "$env:RUNNER_TEMP\RE-UE4SS"
          git -C "$env:RUNNER_TEMP\RE-UE4SS" submodule update --init --recursive --depth 1
      - name: Build probe DLL
        shell: pwsh
        run: |
          cmake -S tools/palpanel-bridge -B "$env:RUNNER_TEMP\palpanel-bridge-build" -A x64 "-DPALPANEL_UE4SS_ROOT=$env:RUNNER_TEMP\RE-UE4SS"
          cmake --build "$env:RUNNER_TEMP\palpanel-bridge-build" --config Release --target PalPanelBridge
          Copy-Item tools/palpanel-bridge/config.ini.example "$env:RUNNER_TEMP\palpanel-bridge-build\artifact\PalPanelBridge\config.ini.example"
          Copy-Item tools/palpanel-bridge/README.md "$env:RUNNER_TEMP\palpanel-bridge-build\artifact\PalPanelBridge\README.md"
          Copy-Item "$env:RUNNER_TEMP\RE-UE4SS\LICENSE" "$env:RUNNER_TEMP\palpanel-bridge-build\artifact\PalPanelBridge\UE4SS-LICENSE.txt"
          Get-FileHash "$env:RUNNER_TEMP\palpanel-bridge-build\artifact\PalPanelBridge\dlls\main.dll" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant()) *dlls/main.dll" } |
            Set-Content -Encoding ascii "$env:RUNNER_TEMP\palpanel-bridge-build\artifact\PalPanelBridge\SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: PalPanelBridge-v0.1.0-ue4ss-v3.0.1
          if-no-files-found: error
          path: ${{ runner.temp }}/palpanel-bridge-build/artifact/PalPanelBridge
